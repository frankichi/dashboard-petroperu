<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reposiciones Marítimas y Coberturas Proyectadas — Petroperú</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#eef1f6;--card:#fff;--bdr:#dfe4ec;--txt:#0d1a2e;--txt2:#3d4a5f;--txt3:#7a8699;--mono:'SF Mono',Consolas,monospace;--sans:'Inter',system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:13px;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
.repomar-wrap{padding:24px 26px 50px;max-width:1680px;margin:0 auto}
.repomar-headerbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.repomar-title{font-size:20px;font-weight:800;color:var(--txt);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.repomar-subtitle{font-size:11.5px;color:var(--txt3);margin-top:3px}
.repomar-credit-top{font-size:11px;color:var(--txt3);margin-top:8px;display:flex;align-items:center}
.repomar-credit-top strong{color:var(--txt2);font-weight:700}
.repomar-credit-logo{width:52px;height:52px;border-radius:10px;object-fit:cover;margin-right:12px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.repomar-modo-switch{display:flex;gap:2px;background:#eef1f6;padding:3px;border-radius:9px;flex-shrink:0}
.repomar-modo-btn{border:none;background:transparent;color:var(--txt3);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:7px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.repomar-modo-btn.activo{background:#fff;color:#0071A4;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.repomar-modo-btn:not(.activo):hover{color:var(--txt2)}
.repomar-live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:repomarPulse 2s infinite;display:inline-block;margin:0 7px 0 2px}
@keyframes repomarPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.repomar-scroll{overflow-x:auto;padding-bottom:8px;margin-top:18px}
.repomar-grid{position:relative;min-width:1450px;background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;padding:2px 2px 2px 26px}
.repomar-covblock{position:relative}
.repomar-covblock-vlabel{position:absolute;left:-24px;top:0;bottom:0;width:22px;background:#0071A4;color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:4px 0 0 4px}
.repomar-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.repomar-row{display:grid;align-items:stretch}
.repomar-cell{padding:7px 8px;border:1px solid var(--bdr);font-size:11.5px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);min-height:32px}
.repomar-labelcell{justify-content:flex-start;font-weight:700;color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:#0071A4;border-color:#0071A4}
.repomar-labelcell[data-prod="Diesel"]{background:#0071A4;border-color:#0071A4}
.repomar-labelcell[data-prod="G. Regular"]{background:#ca8a04;border-color:#ca8a04}
.repomar-labelcell[data-prod="G. Premium"]{background:#7c3aed;border-color:#7c3aed}
.repomar-labelcell[data-prod="TA1"]{background:#0d9488;border-color:#0d9488}
.repomar-planthead{font-weight:800;color:#fff;background:#003a56;border-color:#003a56;font-size:11.5px;letter-spacing:.02em}
.repomar-headerrow .repomar-labelcell{background:#003a56;border-color:#003a56}
.repomar-cell-crit{background:#DC271C;color:#fff;font-weight:700;border-color:#c02016;cursor:help}
.repomar-cell-ok{color:var(--txt);font-weight:700;background:#eef7ee;cursor:help}
.repomar-cell-empty{background:#f4f6fa;color:var(--txt3);font-size:10.5px}
.repomar-cov-tip{position:fixed;z-index:5000;background:#0d1a2e;color:#fff;border-radius:8px;padding:10px 13px;font-size:11px;line-height:1.7;box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none;min-width:190px;display:none;font-family:var(--sans,inherit)}
.repomar-cov-tip b{color:#fff;font-size:11.5px;display:block;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:4px}
.repomar-cov-tip .rct-row{display:flex;justify-content:space-between;gap:14px}
.repomar-cov-tip .rct-lbl{color:rgba(255,255,255,.65)}
.repomar-cov-tip .rct-val{font-family:var(--mono);font-weight:700}
.repomar-cell-retorno-na{background:transparent!important;border-color:transparent!important}
.repomar-divider{height:22px;position:relative}
.repomar-divider::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--bdr) 10%,var(--bdr) 90%,transparent)}
.repomar-ships-label{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--txt3);text-transform:uppercase;padding:0 4px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.repomar-retorno-titulo{font-size:10px;font-weight:800;letter-spacing:.06em;color:#0071A4;text-transform:uppercase;white-space:nowrap}
.repomar-ships{position:relative;row-gap:14px}
.repomar-ship-inner-row{background:linear-gradient(90deg,rgba(37,99,235,.03),rgba(37,99,235,.03) 85%,transparent);border-radius:8px}
.repomar-shipbox{background:#fff;border:1px solid var(--bdr);border-radius:8px;font-size:11px;margin:4px 2px;box-shadow:0 1px 4px rgba(0,113,164,.12);overflow:hidden}
.repomar-shipname{font-weight:800;color:#fff;background:#0071A4;font-size:12px;padding:5px 10px;letter-spacing:.02em}
.repomar-shipcargo{color:var(--txt2);font-family:var(--mono);font-size:10px;line-height:1.7;padding:7px 10px 3px;white-space:nowrap}
.repomar-shipzarpe{margin:6px 10px 8px;background:#fff7e6;border:1px solid #f0c869;border-radius:4px;padding:3px 8px;font-size:10px;font-weight:700;color:#8a6416;display:inline-block}
.repomar-shipzarpe-pendiente{background:#f3f4f6!important;border-color:var(--bdr)!important;color:var(--txt3)!important}
.repomar-retorno-pendiente{font-size:9px;color:var(--txt3);text-align:center;padding:6px 2px;font-style:italic}
.repomar-legbox{background:#fff;border:1.5px solid #2563eb;border-radius:6px;padding:5px 7px;font-size:10px;margin:3px 2px;position:relative;z-index:2;box-shadow:0 1px 3px rgba(37,99,235,.18)}
.repomar-legdate{font-weight:800;color:#2563eb;font-size:10px}
.repomar-legprod{color:var(--txt2);font-family:var(--mono);font-size:9.5px;margin-top:1px;white-space:nowrap}
.repomar-legbox.completado{border-color:#16a34a;box-shadow:0 1px 3px rgba(22,163,74,.18)}
.repomar-legbox.completado .repomar-legdate{color:#16a34a}
.repomar-legbox.en-terminal{border-color:#b45309;box-shadow:0 1px 3px rgba(180,83,9,.18)}
/* Indicador "en vivo" — terminal donde el buque está físicamente ahora,
   según el reporte diario de Posicionamiento de Naves más reciente.
   Único elemento animado del módulo, a propósito. */
.repomar-legbox.en-vivo{border-color:#0071A4;animation:repomarLivePulse 2.4s ease-out infinite}
.repomar-legbox.en-vivo.completado{border-color:#0071A4}
.repomar-shipbox.en-vivo{border-color:#0071A4;animation:repomarLivePulseBox 2.4s ease-out infinite}
@keyframes repomarLivePulseBox{0%{box-shadow:0 1px 4px rgba(0,113,164,.12),0 0 0 0 rgba(0,113,164,.35)}65%{box-shadow:0 1px 4px rgba(0,113,164,.12),0 0 0 8px rgba(0,113,164,0)}100%{box-shadow:0 1px 4px rgba(0,113,164,.12),0 0 0 0 rgba(0,113,164,0)}}
@keyframes repomarLivePulse{0%{box-shadow:0 0 0 0 rgba(0,113,164,.38)}65%{box-shadow:0 0 0 9px rgba(0,113,164,0)}100%{box-shadow:0 0 0 0 rgba(0,113,164,0)}}
.repomar-livepill{display:inline-flex;align-items:center;gap:5px;background:#0071A4;color:#fff;font-size:8.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:999px;margin-bottom:3px;line-height:1;text-transform:uppercase}
.repomar-livedot{width:5px;height:5px;border-radius:50%;background:#8be3ae;animation:repomarLiveDot 1.15s ease-in-out infinite}
@keyframes repomarLiveDot{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.repomar-legbox.en-vivo{animation:none;box-shadow:0 0 0 3px rgba(0,113,164,.22)}.repomar-shipbox.en-vivo{animation:none;box-shadow:0 1px 4px rgba(0,113,164,.12),0 0 0 3px rgba(0,113,164,.22)}.repomar-livedot{animation:none}}
.repomar-empty-msg{padding:30px;text-align:center;color:var(--txt3);font-size:13px}
.repomar-loading{padding:60px;text-align:center;color:var(--txt3)}
.repomar-loading-spinner{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:#0071A4;border-radius:50%;animation:repomarSpin 1s linear infinite;margin:0 auto 14px}
@keyframes repomarSpin{to{transform:rotate(360deg)}}
.repomar-error{padding:40px;text-align:center;color:#DC271C}
</style>
</head>

<script>
// Página pública independiente — no carga ninguna línea del
// dashboard interno (index.html). Solo pide el resultado ya calculado
// al backend (?action=getRepoMarData) y lo dibuja. Toda la lógica de
// cálculo (cobertura, quiebres, itinerarios) vive del lado del
// servidor — ver handleGetRepoMarData() en Code.gs.
var API_URL = 'https://script.google.com/macros/s/AKfycbwL5Gec0EmZgha2rNUaORMDT6MBuouyIlV07tlMpQo9O1YcgkiWJdoQUmIafMQhF2kgUg/exec';
var REFRESH_MS = 5 * 60 * 1000;

// ⚠️ AGREGADO — a pedido: alternar entre "Cabotaje Confirmado" y
// "Cabotaje Proyectado" sin volver a pedir datos al servidor — ambos
// escenarios ya vienen en la misma respuesta de getRepoMarData.
window._repomarModoActivo = 'confirmado';
function _repomarCambiarModo(modo) {
  window._repomarModoActivo = modo;
  document.getElementById('repomar-btn-confirmado').classList.toggle('activo', modo === 'confirmado');
  document.getElementById('repomar-btn-proyectado').classList.toggle('activo', modo === 'proyectado');
  if (window._repomarUltimosDatos) render(window._repomarUltimosDatos);
}

function fmtCorta(f) {
  if (!f) return '—';
  var p = f.slice(0,10).split('-');
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}
function fmtHora(f) {
  if (!f || f.indexOf('T') === -1) return '';
  return ' ' + f.split('T')[1].slice(0,5);
}

// ⚠️ AGREGADO — a pedido: agrupar las escalas de un buque por
// terminal+fecha+estado — antes cada producto que un buque descarga en
// la MISMA planta el MISMO día se dibujaba como una caja aparte. Ahora
// se combinan en UNA sola caja, con un encabezado de fecha/estado único
// y todos los productos listados adentro. Se usa tanto en el render
// como en el dibujo de flechas, para que ambos coincidan exactamente.
function _repomarAgruparEscalas(legs) {
  var grupos = [];
  var porClave = {};
  (legs || []).forEach(function(l) {
    var clave = l.terminal + '|' + l.fecha_hasta + '|' + l.estado;
    if (!porClave[clave]) {
      porClave[clave] = {
        terminal: l.terminal, fecha_hasta: l.fecha_hasta, estado: l.estado,
        estadoRealEnTerminal: l.estadoRealEnTerminal, productos: []
      };
      grupos.push(porClave[clave]);
    }
    porClave[clave].productos.push({ producto: l.producto, vol: l.vol });
  });
  return grupos;
}

// Popup informativo al pasar el mouse — usa el detalle de inventario
// que ya viene precalculado del backend (detalleInventario), ya que
// esta página no tiene acceso al motor de cálculo del dashboard interno.
var _repomarDetalleInv = {};
function _repomarMostrarTip(evt) {
  var el = evt.currentTarget;
  var planta = el.getAttribute('data-planta');
  var prod = el.getAttribute('data-prod');
  var tipo = el.getAttribute('data-tipo');
  var d = _repomarDetalleInv[planta + '|' + prod];
  var tip = document.getElementById('repomar-cov-tip');
  if (!tip) return;
  var inv = d ? (d.inv || 0) : 0;
  var pron = d ? (d.pron || 0) : 0;
  var vfact = d ? (d.vfact || 0) : 0;
  var capacidad = d ? (d.capacidad || 0) : 0;
  var vacio = d ? (d.vacio || 0) : 0;

  if (tipo === 'nueva' && d && d.fechaLlegada && d.volDespuesRepo != null) {
    // ⚠️ AGREGADO — a pedido: en "Nueva Cobertura", el popup muestra el
    // volumen PROYECTADO tras la reposición (ya calculado por el
    // backend en detalleInventario — ver handleGetRepoMarData en
    // Code.gs), no el inventario de hoy.
    tip.innerHTML =
      '<b>' + planta + ' \u00b7 ' + prod + ' \u2014 tras la reposici\u00f3n</b>' +
      '<div class="rct-row"><span class="rct-lbl">Llega el</span><span class="rct-val">' + fmtCorta(d.fechaLlegada) + ' (+' + d.diasHastaLlegada + 'd)</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Volumen que repone</span><span class="rct-val">' + d.volPendiente.toFixed(1) + ' MB</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Volumen despu\u00e9s de repo</span><span class="rct-val">' + d.volDespuesRepo.toFixed(1) + ' MB</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Vac\u00edo despu\u00e9s de repo</span><span class="rct-val">' + (d.vacioDespuesRepo != null ? d.vacioDespuesRepo.toFixed(1) + ' MB' : 's/d') + '</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Pron\u00f3stico aprobado</span><span class="rct-val">' + pron.toFixed(2) + ' MB/d</span></div>' +
      '<div style="margin-top:5px;font-size:9.5px;color:rgba(255,255,255,.6);font-style:italic">A partir de la reposici\u00f3n, la venta factible deja de aplicar \u2014 la planta se atiende con el pron\u00f3stico aprobado.</div>';
  } else {
    tip.innerHTML =
      '<b>' + planta + ' \u00b7 ' + prod + '</b>' +
      '<div class="rct-row"><span class="rct-lbl">Inventario actual</span><span class="rct-val">' + inv.toFixed(1) + ' MB</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Capacidad</span><span class="rct-val">' + (capacidad > 0 ? capacidad.toFixed(1) + ' MB' : 's/d') + '</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Vac\u00edo</span><span class="rct-val">' + (capacidad > 0 ? vacio.toFixed(1) + ' MB' : 's/d') + '</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Pron\u00f3stico aprobado</span><span class="rct-val">' + pron.toFixed(2) + ' MB/d</span></div>' +
      '<div class="rct-row"><span class="rct-lbl">Venta factible</span><span class="rct-val">' + vfact.toFixed(2) + ' MB/d</span></div>';
  }
  tip.style.display = 'block';
  _repomarMoverTip(evt);
}
function _repomarMoverTip(evt) {
  var tip = document.getElementById('repomar-cov-tip');
  if (!tip || tip.style.display !== 'block') return;
  var x = evt.clientX + 14, y = evt.clientY + 14;
  var vw = window.innerWidth, vh = window.innerHeight;
  var tipW = tip.offsetWidth || 200, tipH = tip.offsetHeight || 140;
  if (x + tipW > vw) x = evt.clientX - tipW - 14;
  if (y + tipH > vh) y = evt.clientY - tipH - 14;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function _repomarOcultarTip() {
  var tip = document.getElementById('repomar-cov-tip');
  if (tip) tip.style.display = 'none';
}

function filaCobertura(cols, plantas, productos, productosPorPlanta, mapa, tipo) {
  return productos.map(function(prod) {
    var celdas = plantas.map(function(planta) {
      var aplica = (productosPorPlanta[planta] || []).indexOf(prod) !== -1;
      if (!aplica) return '<div class="repomar-cell repomar-cell-empty">—</div>';
      var info = mapa[planta + '|' + prod];
      if (!info || !info.fecha) return '<div class="repomar-cell repomar-cell-empty">s/d</div>';
      var critico = info.dias <= 10;
      return '<div class="repomar-cell ' + (critico ? 'repomar-cell-crit' : 'repomar-cell-ok') + '" data-planta="' + planta + '" data-prod="' + prod + '" data-tipo="' + tipo + '" onmouseenter="_repomarMostrarTip(event)" onmouseleave="_repomarOcultarTip()" onmousemove="_repomarMoverTip(event)">' + fmtCorta(info.fecha) + '</div>';
    }).join('');
    return '<div class="repomar-row" style="grid-template-columns:' + cols + '">' +
      '<div class="repomar-cell repomar-labelcell" data-prod="' + prod + '">' + prod + '</div>' + celdas +
      '<div class="repomar-cell repomar-cell-retorno-na"></div>' +
      '</div>';
  }).join('');
}

function render(data) {
  window._repomarUltimosDatos = data; // guardado para poder redibujar sin volver a pedir al servidor
  var host = document.getElementById('repomar-content');
  var subtitle = document.getElementById('repomar-subtitle');
  var plantas = data.plantas, productos = data.productos;
  // ⚠️ AGREGADO — a pedido: modo "Cabotaje Proyectado" — usa los
  // buques programados en el Simulador BT (no cargas_naves real
  // todavía) y encadena la cobertura sobre la NUEVA COBERTURA del
  // cabotaje confirmado (ya calculada por el backend en
  // handleGetRepoMarData) — "si además de lo confirmado, también se
  // concretan estos otros buques, ¿hasta cuándo llegaría?".
  var modo = window._repomarModoActivo || 'confirmado';
  var buques = modo === 'proyectado' ? (data.buquesProyectados || []) : (data.buques || []);
  var coberturaArriba = modo === 'proyectado' ? data.coberturaNueva : data.coberturaActual;
  var coberturaAbajo = modo === 'proyectado' ? data.coberturaProyectada : data.coberturaNueva;
  var tituloArriba = modo === 'proyectado' ? 'COBERTURA CONFIRMADA (base)' : 'FECHA COBERTURA';
  var tituloAbajo = modo === 'proyectado' ? 'COBERTURA PROYECTADA' : 'NUEVA COBERTURA';
  var tituloBuques = modo === 'proyectado' ? '📋 CABOTAJE PROYECTADO (Simulador BT — aún no confirmado)' : '🚢 CABOTAJE CONFIRMADO';
  var cols = '200px repeat(' + plantas.length + ', minmax(100px, 1fr)) 130px';
  _repomarDetalleInv = data.detalleInventario || {};

  subtitle.textContent = 'Al ' + fmtCorta(data.fechaRef) + ' · generado en vivo desde Cargas de Naves, Posicionamiento de Naves y Cobertura por planta';

  var filaEncabezado = '<div class="repomar-row repomar-headerrow" style="grid-template-columns:' + cols + '">' +
    '<div class="repomar-cell repomar-labelcell" style="background:transparent;border-color:transparent"></div>' +
    plantas.map(function(p){ return '<div class="repomar-cell repomar-planthead">' + p + '</div>'; }).join('') +
    '<div class="repomar-cell" style="background:transparent;border-color:transparent"></div>' +
    '</div>';

  var filasShips = '';
  if (buques.length) {
    filasShips = buques.map(function(b, idx) {
      var cargaTxt = Object.keys(b.cargaInicial || {}).map(function(prod) {
        return prod + ': ' + b.cargaInicial[prod].toFixed(1) + ' MB';
      }).join('<br>');
      var zarpeTxt = b.zarpe
        ? '<div class="repomar-shipzarpe">Zarpó de ' + b.zarpeOrigen + ': ' + fmtCorta(b.zarpe) + fmtHora(b.zarpe) + '</div>'
        : '<div class="repomar-shipzarpe repomar-shipzarpe-pendiente">' + (b.estadoActualPreZarpe || 'Aún en Talara') + '</div>';
      // ⚠️ AGREGADO — a pedido: mismo indicador "en vivo" aplicado a la
      // caja del buque cuando todavía no zarpó (Talara es el origen y
      // no tiene columna propia en la grilla).
      var enVivoEnTalara = !b.zarpe;
      var shipBox = '<div class="repomar-cell" style="align-items:flex-start;padding:4px">' +
        '<div class="repomar-shipbox' + (enVivoEnTalara ? ' en-vivo' : '') + '" style="width:100%">' +
          '<div class="repomar-shipname">🚢 ' + b.buque + '</div>' +
          '<div class="repomar-shipcargo">' + (cargaTxt || 'Sin carga registrada') + '</div>' +
          (enVivoEnTalara ? '<div class="repomar-livepill" style="margin:0 10px 4px">' + '<span class="repomar-livedot"></span>En puerto</div>' : '') +
          zarpeTxt +
        '</div>' +
      '</div>';
      // ⚠️ CORREGIDO — a pedido: agrupar por terminal+fecha ANTES de
      // dibujar — varios productos que llegan a la MISMA planta el
      // MISMO día ahora comparten una sola caja.
      var grupos = _repomarAgruparEscalas(b.legs);
      var legCells = plantas.map(function(planta) {
        var gruposAqui = grupos.filter(function(g){ return g.terminal === planta; });
        if (!gruposAqui.length) return '<div class="repomar-cell" style="background:transparent;border:none"></div>';
        // ⚠️ AGREGADO — a pedido: indicador "en vivo" — el backend manda
        // en b.puertoActualPlanta la planta donde el buque está
        // físicamente ahora (según el último reporte de Posicionamiento
        // de Naves). Solo el PRIMER recuadro de esa planta lleva la
        // píldora "EN PUERTO" y el pulso — uno solo basta.
        var presenteEnPlanta = b.puertoActualPlanta === planta;
        var chips = gruposAqui.map(function(g, gIdxAqui) {
          var esVivo = presenteEnPlanta && gIdxAqui === 0;
          var esCompletado = g.estado === 'COMPLETADO';
          var estadoReal = !esCompletado ? g.estadoRealEnTerminal : null;
          var etiqueta = esCompletado ? 'T.D.' : (estadoReal ? '' : 'E.T.A.');
          var lineaEstado = estadoReal
            ? '<div class="repomar-legdate" style="color:#b45309">' + estadoReal.split(String.fromCharCode(10))[0] + '</div>'
            : '<div class="repomar-legdate">' + etiqueta + ' ' + fmtCorta(g.fecha_hasta) + '</div>';
          var lineasProductos = g.productos.map(function(p) {
            return '<div class="repomar-legprod">' + p.producto + ': ' + p.vol.toFixed(1) + ' MB</div>';
          }).join('');
          return '<div class="repomar-legbox' + (esCompletado ? ' completado' : (estadoReal ? ' en-terminal' : '')) + (esVivo ? ' en-vivo' : '') + '" data-buque="' + b.buque + '" data-leg-idx="' + grupos.indexOf(g) + '">' +
            (esVivo ? '<div class="repomar-livepill"><span class="repomar-livedot"></span>En puerto</div>' : '') +
            lineaEstado +
            lineasProductos +
          '</div>';
        }).join('');
        return '<div class="repomar-cell" style="background:transparent;border:none;flex-direction:column;padding:2px">' + chips + '</div>';
      }).join('');
      // ⚠️ CORREGIDO — a pedido: antes, sin un E.T.A. real confirmado,
      // se mostraba un mensaje ambiguo sin ninguna fecha sobre la cual
      // planificar. Ahora, si el backend pudo estimar el retorno (tabla
      // de distancias + 1 día de estadía), se muestra esa fecha
      // proyectada — con un estilo visual distinto (ámbar, ~) para que
      // quede claro que es una ESTIMACIÓN, no un dato confirmado como
      // el retorno real (azul, sin el ~).
      var retornoTxt;
      if (b.retornoTalara) {
        retornoTxt = '<div class="repomar-legbox" data-retorno-cell="' + idx + '" style="border-color:#0071A4"><div class="repomar-legdate" style="color:#0071A4">Retorno Talara</div><div class="repomar-legprod">' + fmtCorta(b.retornoTalara) + fmtHora(b.retornoTalara) + '</div></div>';
      } else if (b.retornoEstimado) {
        retornoTxt = '<div class="repomar-legbox" data-retorno-cell="' + idx + '" style="border-color:#d97706;border-style:dashed" title="Estimado con la tabla de distancias — última escala + 1 día de estadía + días de navegación hasta Talara. No es un E.T.A. confirmado."><div class="repomar-legdate" style="color:#d97706">~ Retorno Talara (est.)</div><div class="repomar-legprod">' + fmtCorta(b.retornoEstimado) + '</div></div>';
      } else {
        var mensajeRetornoPendiente = b.ultimaEscalaPendienteFecha
          ? 'Se sabrá tras completar su última escala (' + fmtCorta(b.ultimaEscalaPendienteFecha) + ')'
          : 'Aún sin ETA de retorno';
        retornoTxt = '<div class="repomar-retorno-pendiente">' + mensajeRetornoPendiente + '</div>';
      }
      var retornoCell = '<div class="repomar-cell" style="background:transparent;border:none;padding:4px">' + retornoTxt + '</div>';
      return '<div class="repomar-row repomar-ship-inner-row" data-ship-row="' + idx + '" style="grid-template-columns:' + cols + '">' + shipBox + legCells + retornoCell + '</div>';
    }).join('');
  } else {
    filasShips = '<div class="repomar-empty-msg">No hay cabotaje marítimo vigente en este momento.</div>';
  }

  host.innerHTML =
    '<div class="repomar-scroll"><div class="repomar-grid" id="repomar-grid">' +
      '<svg class="repomar-svg" id="repomar-svg"></svg>' +
      filaEncabezado +
      '<div class="repomar-covblock">' +
        '<div class="repomar-covblock-vlabel">' + tituloArriba + '</div>' +
        filaCobertura(cols, plantas, productos, data.productosPorPlanta, coberturaArriba, 'actual') +
      '</div>' +
      '<div class="repomar-divider"></div>' +
      '<div class="repomar-row" style="grid-template-columns:' + cols + '">' +
        '<div class="repomar-cell" style="grid-column:1/-2;justify-content:flex-start;background:transparent;border:none;padding:0 0 6px">' +
          '<div class="repomar-ships-label">' + tituloBuques + '</div>' +
        '</div>' +
        '<div class="repomar-cell" style="background:transparent;border:none;padding:0 4px 6px;align-items:flex-end;justify-content:center">' +
          '<div class="repomar-retorno-titulo">↩ Retorno</div>' +
        '</div>' +
      '</div>' +
      '<div class="repomar-ships" id="repomar-ships">' + filasShips + '</div>' +
      '<div class="repomar-divider"></div>' +
      '<div class="repomar-covblock">' +
        '<div class="repomar-covblock-vlabel">' + tituloAbajo + '</div>' +
        filaCobertura(cols, plantas, productos, data.productosPorPlanta, coberturaAbajo, 'nueva') +
      '</div>' +
      filaEncabezado +
    '</div></div>';

  requestAnimationFrame(function() { drawArrows(buques); });
}

function drawArrows(buques) {
  var grid = document.getElementById('repomar-grid');
  var svg = document.getElementById('repomar-svg');
  if (!grid || !svg) return;
  var gridRect = grid.getBoundingClientRect();
  svg.setAttribute('width', gridRect.width);
  svg.setAttribute('height', gridRect.height);
  var pathsHTML = '';
  buques.forEach(function(b, idx) {
    var row = grid.querySelector('[data-ship-row="' + idx + '"]');
    if (!row) return;
    var shipBox = row.querySelector('.repomar-shipbox');
    if (!shipBox) return;
    var sRect = shipBox.getBoundingClientRect();
    // ⚠️ CORREGIDO — bug real confirmado (la flecha salía como un lazo
    // torcido cuando la siguiente escala quedaba a la IZQUIERDA de la
    // anterior en pantalla — por ejemplo, un cabotaje que va de sur a
    // norte). Ahora el punto de conexión es el CENTRO SUPERIOR de cada
    // caja, sin importar si el siguiente punto queda a la izquierda o
    // a la derecha del anterior.
    // Punto de partida: CENTRO de la caja (no el borde superior) — a pedido,
    // para que la primera flecha no arranque "muy confusa" desde el borde
    // y en su lugar salga desde el medio de la caja del buque.
    var prevX = sRect.left + sRect.width/2 - gridRect.left;
    var prevY = sRect.top + sRect.height/2 - gridRect.top;
    // ⚠️ CORREGIDO — a pedido: iterar sobre los GRUPOS combinados
    // (terminal+fecha), no sobre cada escala individual.
    var gruposDibujo = _repomarAgruparEscalas(b.legs);
    gruposDibujo.forEach(function(g, grupoIdx) {
      var legEl = row.querySelector('.repomar-legbox[data-buque="' + b.buque + '"][data-leg-idx="' + grupoIdx + '"]');
      if (!legEl) return;
      var lRect = legEl.getBoundingClientRect();
      var x1 = lRect.left + lRect.width/2 - gridRect.left;
      var y1 = lRect.top - gridRect.top;
      var midX = (prevX + x1) / 2;
      var distanciaHoriz = Math.abs(x1 - prevX);
      var alturaCurva = Math.max(38, Math.min(55, distanciaHoriz * 0.15));
      var controlY = Math.min(prevY, y1) - alturaCurva;
      pathsHTML += '<path d="M' + prevX + ',' + prevY + ' Q' + midX + ',' + controlY + ' ' + x1 + ',' + y1 + '" ' +
        'fill="none" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#repomar-arrow)"/>';
      prevX = x1;
      prevY = y1;
    });
    var retornoEl = row.querySelector('.repomar-legbox[data-retorno-cell="' + idx + '"]');
    if (retornoEl) {
      var rRect = retornoEl.getBoundingClientRect();
      var xR = rRect.left + rRect.width/2 - gridRect.left;
      var yR = rRect.top - gridRect.top;
      var midXR = (prevX + xR) / 2;
      var alturaCurvaR = Math.max(38, Math.min(55, Math.abs(xR - prevX) * 0.15));
      var controlYR = Math.min(prevY, yR) - alturaCurvaR;
      pathsHTML += '<path d="M' + prevX + ',' + prevY + ' Q' + midXR + ',' + controlYR + ' ' + xR + ',' + yR + '" ' +
        'fill="none" stroke="#0071A4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#repomar-arrow-retorno)"/>';
    }
  });
  svg.innerHTML = '<defs>' +
    '<marker id="repomar-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#93c5fd"/></marker>' +
    '<marker id="repomar-arrow-retorno" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0071A4"/></marker>' +
    '</defs>' + pathsHTML;
}

var _lastBuques = [];
var REPOMAR_CACHE_KEY = 'repomar_cache_v1';

// ⚠️ AGREGADO — a pedido: el splash "Cargando datos en vivo…" se sentía
// lento porque CADA carga (la inicial y cada refresh de 5 min) esperaba
// la respuesta completa del backend (Apps Script en frío puede tardar
// varios segundos) antes de mostrar cualquier cosa. Ahora, si hay un
// resultado previo guardado en este navegador (localStorage), se
// renderiza YA — sin esperar red — y el fetch real corre en paralelo
// por detrás, reemplazando la vista en cuanto llega. El splash con
// spinner solo se ve la primerísima vez que alguien abre el enlace en
// un navegador nuevo, sin caché previa.
function _repomarLeerCache() {
  try {
    var raw = localStorage.getItem(REPOMAR_CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function _repomarGuardarCache(data) {
  try { localStorage.setItem(REPOMAR_CACHE_KEY, JSON.stringify({ data: data, ts: Date.now() })); }
  catch (e) { /* localStorage lleno o bloqueado — no es crítico, solo no habrá caché */ }
}

function cargarDatos(esSilencioso) {
  fetch(API_URL + '?action=getRepoMarData', { method: 'GET', redirect: 'follow' })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function(data) {
      _lastBuques = data.buques || [];
      render(data);
      _repomarGuardarCache(data);
    })
    .catch(function(err) {
      // En refresh silencioso (ya hay algo en pantalla) no se pisa la
      // vista actual con un error — se deja lo último bueno visible y
      // se reintenta en el próximo ciclo.
      if (esSilencioso) { if (window.console && console.warn) console.warn('repomar refresh:', err.message); return; }
      document.getElementById('repomar-content').innerHTML =
        '<div class="repomar-error">No se pudo cargar la información en este momento.<br><span style="font-size:11px;color:var(--txt3)">' + err.message + '</span></div>';
    });
}

var _repomarCacheado = _repomarLeerCache();
if (_repomarCacheado && _repomarCacheado.data) {
  _lastBuques = _repomarCacheado.data.buques || [];
  render(_repomarCacheado.data);
  cargarDatos(true); // refresca por detrás sin volver a mostrar el spinner
} else {
  cargarDatos(false);
}
setInterval(function() { cargarDatos(true); }, REFRESH_MS);
window.addEventListener('resize', function() {
  clearTimeout(window._repomarResizeTimer);
  window._repomarResizeTimer = setTimeout(function() { drawArrows(_lastBuques); }, 120);
});
</script>
</body>
</html>
